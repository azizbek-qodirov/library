name: library

x-db: &db
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-library}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-library_db}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_SSL_MODE: disable

x-covers: &covers
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-library-covers}
  MINIO_PUBLIC_URL: /covers

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_DB: ${POSTGRES_DATABASE:-library_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: library-minio:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: object-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: library-ops:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: ops
    command: ["migrate"]
    environment: *db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    image: library-ops:${IMAGE_TAG:-local}
    pull_policy: never
    command: ["seed-if-empty"]
    environment:
      <<: [*db, *covers]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: "no"

  library-service:
    image: library-service:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: library-service
    restart: unless-stopped
    environment:
      <<: *db
      GRPC_BIND_ADDRESS: ":50050"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  gateway:
    image: library-gateway:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      <<: *covers
      GATEWAY_HTTP_PORT: ":8088"
      LIBRARY_GRPC_ADDRESS: library-service:50050
      STAFF_USERNAME: ${STAFF_USERNAME:?Set STAFF_USERNAME}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD}
    depends_on:
      library-service:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/books?limit=1"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    image: library-web:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${LIBRARY_HTTP_PORT:-8080}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15

  seed:
    profiles: ["maintenance"]
    image: library-ops:${IMAGE_TAG:-local}
    pull_policy: never
    command: ["reset-demo-catalog"]
    environment:
      <<: [*db, *covers]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  tests:
    profiles: ["test"]
    image: library-tests:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: go-build
    environment:
      LIBRARY_TEST_DATABASE_URL: ${LIBRARY_TEST_DATABASE_URL:-}
    command:
      - sh
      - -ec
      - |
        (cd backend/api-gateway && go test ./...)
        (cd backend/library-service && go test ./...)
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
