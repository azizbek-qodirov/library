name: Library CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_PASSWORD: ci-postgres-only
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-minio-only-password
      STAFF_USERNAME: ci-librarian
      STAFF_PASSWORD: ci-staff-only-password
      LIBRARY_HTTP_PORT: '18080'
      SMOKE_URL: http://127.0.0.1:18080
      LIBRARY_TEST_DATABASE_URL: postgres://library:ci-postgres-only@postgres:5432/library_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Build and check the stack
        run: |
          docker compose --profile test config --quiet
          docker compose pull postgres
          docker compose --profile test build
          docker compose up -d --no-build --wait --wait-timeout 180

      - name: Run PostgreSQL integration tests
        run: |
          docker compose exec -T postgres createdb -U library library_test
          docker compose run --rm tests

      - name: Verify seed, catalog, and cover storage
        run: |
          python3 deploy/smoke.py
          docker compose exec -T postgres psql -U library -d library_db -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (full_name, role) VALUES ('Old fixture', 'student')"
          docker compose run --rm bootstrap
          test "$(docker compose exec -T postgres psql -U library -d library_db -Atc 'SELECT count(*) FROM users')" = 1
          docker compose run --rm seed
          python3 deploy/smoke.py
          python3 deploy/api_smoke.py
          docker compose run --rm migrate

      - name: Show container status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=50

      - name: Deploy the tested images over SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          umask 077
          : "${SSH_HOST:?Missing SSH_HOST}" "${SSH_USER:?Missing SSH_USER}" "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}" "${DEPLOY_ENV:?Missing DEPLOY_ENV}"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage/bundle"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$stage/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$stage/known_hosts"
          printf '%s\nIMAGE_TAG=%s\n' "$DEPLOY_ENV" "$IMAGE_TAG" > "$stage/bundle/.env"
          cp compose.yaml deploy/release.sh "$stage/bundle/"
          docker save postgres:16-alpine "library-minio:$IMAGE_TAG" "library-ops:$IMAGE_TAG" \
            "library-service:$IMAGE_TAG" "library-gateway:$IMAGE_TAG" "library-web:$IMAGE_TAG" \
            | gzip -1 > "$stage/bundle/images.tar.gz"
          target="\$HOME/library-deploy/releases/$IMAGE_TAG"
          tar -C "$stage/bundle" -cf - . \
            | ssh -i "$stage/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known_hosts" "$SSH_USER@$SSH_HOST" \
              "umask 077; mkdir -p \"$target\" && tar -xf - -C \"$target\" && bash \"$target/release.sh\""

      - name: Remove the CI stack
        if: always()
        run: docker compose down -v --remove-orphans
