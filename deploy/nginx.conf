server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # Resolve these names again when Compose replaces a backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8088;
    set $storage http://minio:9000;

    location = /healthz {
        proxy_pass $gateway/books?limit=1;
    }

    location /api/swagger/ {
        proxy_pass $gateway;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_read_timeout 45s;
    }

    location /covers/ {
        limit_except GET { deny all; }
        rewrite ^/covers/(.*)$ /$1 break;
        proxy_pass $storage;
    }

    location = /librarian {
        return 308 /librarian/;
    }

    location /librarian/ {
        try_files $uri $uri/ /librarian/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
