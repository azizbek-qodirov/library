paths:
  /author:
    post:
      consumes:
      - application/json
      description: Creates a new author in the database
      parameters:
      - description: Author create request
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/genproto.AuthorCreateReq'
