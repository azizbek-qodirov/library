syntax = "proto3";

option go_package = "/internal/pkg/genproto";

package protos;

import "library_submodule/void.proto";

service UserService{
    rpc CreateUser(UserCreateReq) returns (Void);
    rpc GetUser(ByID) returns (UserGetRes);
    rpc UpdateUser(UserUpdateReq) returns (Void);
    rpc DeleteUser(ByID) returns (Void);
    rpc GetAllUsers(UsersGetAllReq) returns (UsersGetAllRes);
};

message UserCreateReq {
    string full_name = 1;
    string group_name = 2;
    string email = 3;
    string phone = 4;
    string role = 5;
};

message UserGetRes {
    string id = 1;
    string full_name = 2;
    optional string group_name = 3;
    optional string email = 4;
    optional string phone = 5;
    string role = 6;
    string created_at = 7;
    string updated_at = 8;
};

message UserUpdateBody {
    string full_name = 1;
    string group_name = 2;
    string email = 3;
    string phone = 4;
    string role = 5;
};

message UserUpdateReq {
    string id = 1;
    UserUpdateBody body = 2;
};

message UsersGetAllReq {
    int64 limit = 1;
    int64 offset = 2;
    string search = 3;
    string group_name = 4;
    string role = 5;
};

message UsersGetAllRes {
    repeated UserGetRes users = 1;
    int64 total = 2;
};
