syntax = "proto3";

option go_package = "/internal/pkg/genproto";

package protos;

import "library_submodule/void.proto";
import "library_submodule/book.proto";

service RecommendedService{
    rpc CreateRecommended(RecommendedCreateReq) returns (Void);
    rpc GetRecommended(ByID) returns (RecommendedGetRes);
    rpc DeleteRecommended(ByID) returns (Void);
    rpc GetAllRecommendeds(RecommendedsGetAllReq) returns (RecommendedsGetAllRes);
};

message RecommendedCreateReq {
    string book_id = 1;
}

message RecommendedGetRes {
    string id = 1;
    BookGetRes book_id = 2;
    string created_at = 3;
}

message RecommendedsGetAllReq {
    int64 offset = 1;
    int64 limit = 2;
    string search = 3;
}

message RecommendedsGetAllRes {
    repeated RecommendedGetRes recommendeds = 1;
    int64 total_count = 2;
}
