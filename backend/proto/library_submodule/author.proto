syntax = "proto3";

option go_package = "/internal/pkg/genproto";

package protos;

import "library_submodule/void.proto";

service AuthorService {
    rpc CreateAuthor(AuthorCreateReq) returns (AuthorGetRes);
    rpc GetAuthor(ByID) returns (AuthorGetRes);
    rpc UpdateAuthor(AuthorUpdateReq) returns (Void);
    rpc DeleteAuthor(ByID) returns (Void);
    rpc GetAllAuthors(AuthorsGetAllReq) returns (GetAllAuthorsRes);
}

message AuthorCreateReq {
    string name = 1;
    optional string birth_date = 2;
    string biography = 3;
}

message AuthorGetRes {
    string id = 1;
    string name = 2;
    optional string birth_date = 3;
    string biography = 4;
}

message AuthorUpdateReq {
    string id = 1;
    AuthorUpdateBody body = 2;
}

message AuthorUpdateBody {
    string name = 1;
    optional string birth_date = 2;
    string biography = 3;
}

message AuthorsGetAllReq {
    uint64 limit = 1;
    uint64 offset = 2;
    string order_by = 3;
    string search = 5;
}

message GetAllAuthorsRes {
    repeated AuthorGetRes authors = 1;
    uint64 total_count = 2;
}
