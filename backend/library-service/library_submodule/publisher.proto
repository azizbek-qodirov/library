syntax = "proto3";

option go_package = "/internal/pkg/genproto";

package protos;

import "library_submodule/void.proto";

service PublisherService{
    rpc CreatePublisher(PublisherCreateReq) returns (Void);
    rpc GetPublisher(ByID) returns (PublisherGetRes);
    rpc UpdatePublisher(PublisherUpdateReq) returns (Void);
    rpc DeletePublisher(ByID) returns (Void);
    rpc GetAllPublishers(PublishersGetAllReq) returns (GetAllPublishersRes);
};


message PublisherCreateReq {
    string name = 1;
    string description = 2;
}

message PublisherGetRes {
    string id = 1;
    string name = 2;
    string description = 3;
};

message PublisherUpdateReq {
    string id = 1;
    PublisherUpdateBody body = 2;
};

message PublisherUpdateBody {
    string name = 1;
    string description = 2;
};

message PublishersGetAllReq {
    uint64 limit = 1;
    uint64 offset = 2;
    string order_by = 3;
    string search = 4;
};

message GetAllPublishersRes {
    repeated PublisherGetRes publishers = 1;
    uint64 total_count = 2;
};
